<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kong Jiarui · 个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #333;
      background: #fafafa;
      line-height: 1.8;
    }
    .hero {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 60%, #a855f7 100%);
      color: #fff;
      text-align: center;
      padding: 90px 20px 70px;
    }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
      border: 3px solid rgba(255,255,255,0.5);
    }
    .hero h1 { font-size: 34px; letter-spacing: 2px; margin-bottom: 8px; }
    .hero .sub { font-size: 17px; opacity: 0.95; }
    .hero .tagline { margin-top: 14px; font-size: 14px; opacity: 0.8; }
    .container { max-width: 820px; margin: -40px auto 60px; padding: 0 20px; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      padding: 36px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 20px;
      color: #4f46e5;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid #a855f7;
    }
    .card p { color: #555; font-size: 15px; }
    .interests { display: flex; flex-wrap: wrap; gap: 14px; }
    .tag {
      background: #f3f0ff;
      color: #5b21b6;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
    }
    footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="avatar">📖</div>
    <h1>Kong Jiarui</h1>
    <div class="sub">复旦大学 · 保险学在读</div>
    <div class="tagline">理性地思考，温柔地生活 🌱</div>
  </div>

  <div class="container">
    <div class="card">
      <h2>关于我</h2>
      <p>你好，我是 Kong Jiarui，目前是复旦大学保险学专业的一名在读研究生，正一步步探索金融与风险的世界。</p>
      <p>生活中的我，一半理性、一半感性：平时喜欢和数字、逻辑打交道，空闲时则喜欢钻进文字里写小说，把脑海里的故事一点点变成现实。我相信持续学习和保持好奇，能让人走得更远。</p>
      <p>很高兴认识你，欢迎来到我的小天地。</p>
    </div>

    <div class="card">
      <h2>兴趣爱好</h2>
      <div class="interests">
        <span class="tag">✍️ 写小说</span>
        <span class="tag">📚 阅读</span>
        <span class="tag">🌍 探索新事物</span>
        <span class="tag">🎵 音乐</span>
      </div>
    </div>


  <footer>© 2026 Kong Jiarui · 感谢来访 💛</footer>
</body>
</html>
